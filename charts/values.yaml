replicaCount: 1


image:
  repository: civo/node-agent
  pullPolicy: IfNotPresent
  tag: "6b8426a"

# Comma-separated node pool IDs to watch (empty = all nodes).
nodePoolIDs: ""

# Reboot wait time for standard nodes (minutes).
rebootWaitMinutes: 10

# Reboot wait time for GPU nodes (minutes).
gpuRebootWaitMinutes: 40

# Monitor-only mode: log recovery actions without executing them.
monitorOnly: true

# Port for Prometheus metrics endpoint.
metricsPort: 9625

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
resources: {}


autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
